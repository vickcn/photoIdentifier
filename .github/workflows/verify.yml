name: Verify

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run focused tests
        run: |
          pytest tests/test_batch_upload_api.py tests/test_insight_api_client.py -q

      - name: Verify Python compile
        run: |
          python -m py_compile main.py src/batch_state_store.py
